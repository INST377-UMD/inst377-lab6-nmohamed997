<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 6 Random Map Generator</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        #map {
            height: 400px;
            width: 100%;
        }
    </style>
</head>
<body>
    <h1>Lab 6 Map Generatoe with Markers</h1>

    <div id="map"></div>

    <div id="markers">
        <p id="marker1">Marker 1: </p>
        <p id="marker2">Marker 2: </p>
        <p id="marker3">Marker 3: </p>
    </div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        // Initialize map
        const map = L.map('map').setView([32.5, -95], 5); 

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        function getRandomInRange(from, to, fixed) {
            return (Math.random() * (to - from) + from).toFixed(fixed) * 1;
        }

        const coords = [
            { lat: getRandomInRange(30, 35, 3), lng: getRandomInRange(-100, -90, 3) },
            { lat: getRandomInRange(30, 35, 3), lng: getRandomInRange(-100, -90, 3) },
            { lat: getRandomInRange(30, 35, 3), lng: getRandomInRange(-100, -90, 3) }
        ];

        async function getLocality(lat, lng, markerTextId) {
            const url = `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lng}&localityLanguage=en`;
            const response = await fetch(url);
            const data = await response.json();
            document.getElementById(markerTextId).innerHTML += ` (${lat}, ${lng}) - ${data.locality || "No locality found"}`;
        }

        coords.forEach((coord, index) => {
            const marker = L.marker([coord.lat, coord.lng]).addTo(map);
            const markerTextId = `marker${index + 1}`;
            getLocality(coord.lat, coord.lng, markerTextId);
        });
    </script>
</body>
</html>
